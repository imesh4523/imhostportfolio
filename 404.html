<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="/assets/lottie.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #F8F9FD;
            color: #181432;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            user-select: none;
        }
        .container-404 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 440px;
            width: 100%;
        }
        #lottie-404 {
            width: 320px;
            height: 320px;
            max-width: 85vw;
            max-height: 60vh;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #181432;
            margin-top: 10px;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body>
    <div class="container-404">
        <div id="lottie-404"></div>
        <h1>404 - Page Not Found</h1>
    </div>
    <script>
        function init404() {
            fetch('/assets/animation-404.json')
                .then(res => res.json())
                .then(animationData => {
                    if (window.lottie) {
                        window.lottie.loadAnimation({
                            container: document.getElementById('lottie-404'),
                            renderer: 'svg',
                            loop: true,
                            autoplay: true,
                            animationData: animationData
                        });
                    }
                })
                .catch(() => {});
        }
        if (window.lottie) {
            init404();
        } else {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js';
            script.onload = init404;
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
